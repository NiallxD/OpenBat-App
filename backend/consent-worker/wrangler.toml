name = "openbat-consent"
main = "src/index.ts"
compatibility_date = "2026-07-23"

[[d1_databases]]
binding = "DB"
database_name = "openbat-consent"
database_id = "4f370336-efd6-45cb-823e-f33a0953ce4f"

[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "openbat-community-recordings"

# Hourly sweep: retries erasure notifications that haven't landed yet and purges
# expired erasure records. Cron triggers are free on Workers. Without this, a
# notification that failed at erase time would never be retried — and that email
# is what tells the privacy team to go delete archive copies.
[triggers]
crons = ["0 * * * *"]

# Per-device throttle. `src/index.ts` treats this binding as optional and fails
# open if it's missing, so a deploy without it still works — the device-token
# checks are the real gate; this only bounds volume. 60 requests/minute is well
# clear of any legitimate client (one upload is one request).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# RESEND_API_KEY and DEVICE_TOKEN_SECRET are secrets, not declared here — see
# README.md ("wrangler secret put ...").
